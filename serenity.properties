serenity.project.name=Proyecto ParaBank - QA Screenplay
webdriver.driver=chrome
webdriver.base.url=https://parabank.parasoft.com/parabank/index.htm
serenity.take.screenshots=AFTER_EACH_STEP
serenity.report.encoding=UTF8
serenity.console.colors=false
webdriver.timeouts.implicitlywait=0
webdriver.wait.for.timeout=12000
# Reiniciar el navegador para cada escenario
serenity.restart.browser.for.each=scenario
serenity.use.unique.browser=false