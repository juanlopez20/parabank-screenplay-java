plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.2'
}

group = 'co.edu.ucc.parabank'
version = '1.0.0'

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
ext {
    serenityVersion = '5.3.2'
    cucumberVersion = '7.34.2'
    junitVersion = '6.0.3'
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

test {
    useJUnitPlatform()
    systemProperties System.getProperties()
    // Ejecutar solo escenarios públicos, sin alterar datos, por defecto.
    if (!System.getProperty('cucumber.filter.tags')) {
        systemProperty 'cucumber.filter.tags', '@smoke'
    }
    testLogging { events 'passed', 'failed', 'skipped' }
}

serenity { reports = ['single-page-html'] }

test.finalizedBy('aggregate')
